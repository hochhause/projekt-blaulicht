{% extends "base.html" %}
{% block nav %}<a href="/">&larr; Dashboard</a>&nbsp;&nbsp;<a href="/accounts/{{ account.id }}/details">Details / log</a>{% endblock %}
{% block content %}
<h1>{{ account.label }}</h1>
<p class="muted" style="margin-top:0">{{ account.email }} · server {{ account.server }}</p>

<form method="post" action="/accounts/{{ account.id }}">
  <div class="card">
    <h2>Credentials</h2>
    <div class="grid">
      <div class="field"><label>Label</label><input name="label" value="{{ account.label }}" required></div>
      <div class="field"><label>E-mail or username</label><input name="email" value="{{ account.email }}" required></div>
    </div>
    <div class="field"><label>New password (leave blank to keep)</label><input name="password" type="password" placeholder="••••••••"></div>
  </div>

  <div class="card">
    <h2>Dispatch</h2>
    <div class="grid">
      <div class="field"><label>Radius (km)</label><input name="radius_km" type="number" step="1" value="{{ cfg.radius_km }}"></div>
      <div class="field"><label>Order — which missions first</label>
        <select name="order">
          <option value="nearest" {{ 'selected' if cfg.order == 'nearest' else '' }}>Nearest first</option>
          <option value="farthest" {{ 'selected' if cfg.order == 'farthest' else '' }}>Farthest first</option>
          <option value="credits_high" {{ 'selected' if cfg.order == 'credits_high' else '' }}>Most cash first</option>
          <option value="credits_low" {{ 'selected' if cfg.order == 'credits_low' else '' }}>Least cash first</option>
          <option value="oldest" {{ 'selected' if cfg.order == 'oldest' else '' }}>Oldest first</option>
          <option value="newest" {{ 'selected' if cfg.order == 'newest' else '' }}>Newest first</option>
        </select></div>
      <div class="field"><label>Parasite mode (leech shared/event missions)</label>
        <select name="parasite_mode"><option value="1" {{ 'selected' if cfg.parasite_mode else '' }}>on</option><option value="" {{ '' if cfg.parasite_mode else 'selected' }}>off</option></select></div>
      <div class="field"><label>Mission source</label>
        <select name="mission_source">
          <option value="both" {{ 'selected' if cfg.mission_source == 'both' else '' }}>Both (own + alliance)</option>
          <option value="own" {{ 'selected' if cfg.mission_source == 'own' else '' }}>My own only</option>
          <option value="alliance" {{ 'selected' if cfg.mission_source == 'alliance' else '' }}>Alliance shared only</option>
        </select></div>
      <div class="field"><label>Own — min cash (0 = none)</label><input name="own_credit_min" type="number" step="1" value="{{ cfg.own_credit_min }}"></div>
      <div class="field"><label>Own — max cash (0 = none)</label><input name="own_credit_max" type="number" step="1" value="{{ cfg.own_credit_max }}"></div>
      <div class="field"><label>Alliance — min cash (0 = none)</label><input name="alliance_credit_min" type="number" step="1" value="{{ cfg.alliance_credit_min }}"></div>
      <div class="field"><label>Alliance — max cash (0 = none)</label><input name="alliance_credit_max" type="number" step="1" value="{{ cfg.alliance_credit_max }}"></div>
      <div class="field"><label>Alliance — min age since shared (min, 0 = none)</label><input name="alliance_min_age_minutes" type="number" step="0.5" value="{{ cfg.alliance_min_age_minutes }}"></div>
      <div class="field"><label>Alliance — max age since shared (min, 0 = none)</label><input name="alliance_max_age_minutes" type="number" step="0.5" value="{{ cfg.alliance_max_age_minutes }}"></div>
      <div class="field"><label>Alliance radius km (blank = same as radius)</label>
        <input name="alliance_radius_km" type="number" step="1" value="{{ cfg.alliance_radius_km if cfg.alliance_radius_km is not none else '' }}"></div>
      <div class="field"><label>Batch size — missions per cycle (blank = all)</label>
        <input name="batch_size" type="number" step="1" value="{{ cfg.batch_size if cfg.batch_size is not none else '' }}"></div>
      <div class="field"><label>Max vehicles / mission (blank = no cap)</label>
        <input name="max_vehicles_per_mission" type="number" step="1" value="{{ cfg.max_vehicles_per_mission if cfg.max_vehicles_per_mission is not none else '' }}"></div>
      <div class="field"><label>Only these categories (comma-sep, blank = all)</label>
        <input name="allowed_categories" value="{{ cfg.allowed_categories | join(', ') }}" placeholder="fire, police"></div>
      <div class="field"><label>Poll interval (s)</label><input name="poll_seconds" type="number" step="1" value="{{ cfg.poll_seconds }}"></div>
      <div class="field"><label>Jitter (s)</label><input name="jitter_seconds" type="number" step="1" value="{{ cfg.jitter_seconds }}"></div>
      <div class="field"><label>Max vehicles to load (0 = ALL — set 0 unless huge)</label>
        <input name="max_vehicles" type="number" step="1" value="{{ cfg.max_vehicles }}"></div>
    </div>
  </div>

  <div class="card">
    <h2>Transport</h2>
    <div class="grid">
      <div class="field"><label>Enabled (handle Sprechwünsche each cycle)</label>
        <select name="transport_enabled"><option value="1" {{ 'selected' if cfg.transport_enabled else '' }}>yes</option><option value="" {{ '' if cfg.transport_enabled else 'selected' }}>no</option></select></div>
      <div class="field"><label>Transport-only mode (no dispatching)</label>
        <select name="transport_only"><option value="1" {{ 'selected' if cfg.transport_only else '' }}>yes</option><option value="" {{ '' if cfg.transport_only else 'selected' }}>no</option></select></div>
      <div class="field"><label>Max distance (km)</label><input name="transport_max_distance_km" type="number" step="1" value="{{ cfg.transport_max_distance_km }}"></div>
      <div class="field"><label>Max alliance tax % (blank = ignore)</label>
        <input name="transport_max_tax" type="number" step="1" value="{{ cfg.transport_max_tax if cfg.transport_max_tax is not none else '' }}"></div>
      <div class="field"><label>Prefer own buildings</label>
        <select name="transport_prefer_own"><option value="1" {{ 'selected' if cfg.transport_prefer_own else '' }}>yes</option><option value="" {{ '' if cfg.transport_prefer_own else 'selected' }}>no</option></select></div>
      <div class="field"><label>Allow alliance buildings</label>
        <select name="transport_allow_alliance"><option value="1" {{ 'selected' if cfg.transport_allow_alliance else '' }}>yes</option><option value="" {{ '' if cfg.transport_allow_alliance else 'selected' }}>no</option></select></div>
    </div>
  </div>

  <button type="submit" class="primary">Save</button>
</form>
{% endblock %}
