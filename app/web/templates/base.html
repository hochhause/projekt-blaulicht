<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projekt Blaulicht</title>
  <style>
    :root{
      --ground:#0a0e15; --panel:#10192a; --raise:#16223a; --line:#24344f;
      --ink:#e9eff7; --muted:#8697ad; --amber:#ff9e2c; --blau:#4a90ff;
      --ok:#37c26b; --crit:#ff5847;
      --mono:ui-monospace,"Cascadia Code","JetBrains Mono","SF Mono",Menlo,Consolas,monospace;
      --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
    a{color:var(--blau);text-decoration:none}
    a:hover{text-decoration:underline}
    header.top{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--panel)}
    header.top .brand{font-family:var(--mono);font-weight:700;letter-spacing:.06em}
    header.top .brand b{color:var(--blau)}
    header.top .spacer{flex:1}
    .wrap{max-width:1000px;margin:0 auto;padding:26px 22px}
    h1,h2{font-family:var(--mono);font-weight:640;letter-spacing:-.01em}
    h1{font-size:22px;margin:0 0 4px}
    .muted{color:var(--muted)}
    table{width:100%;border-collapse:collapse;margin-top:16px;font-size:14px}
    th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
    th{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
    .pill{font-family:var(--mono);font-size:11px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px}
    .pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--sw,var(--muted))}
    .pill.running{--sw:var(--blau)} .pill.idle{--sw:var(--ok)} .pill.error{--sw:var(--crit)} .pill.stopped{--sw:var(--muted)}
    input,select,button{font-family:inherit;font-size:14px}
    input,select{background:var(--raise);border:1px solid var(--line);color:var(--ink);border-radius:7px;padding:8px 10px;width:100%}
    label{display:block;margin:0 0 4px;font-size:12px;color:var(--muted);font-family:var(--mono);letter-spacing:.04em}
    .field{margin-bottom:14px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    button,.btn{background:var(--raise);border:1px solid var(--line);color:var(--ink);border-radius:7px;padding:7px 13px;cursor:pointer}
    button.primary{background:color-mix(in srgb,var(--blau) 22%,var(--raise));border-color:var(--blau)}
    button.danger{border-color:var(--crit);color:var(--crit)}
    button:hover{filter:brightness(1.12)}
    .inline{display:inline}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;margin-top:18px}
    .err{color:var(--crit);font-size:13px;margin-top:8px}
    .actions form{display:inline}
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <header class="top">
    <span class="brand">&#9650; PROJEKT <b>BLAULICHT</b></span>
    <span class="muted" style="font-family:var(--mono);font-size:12px">Leitstelle dispatch console</span>
    <span class="spacer"></span>
    {% block nav %}{% endblock %}
  </header>
  <div class="wrap">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
