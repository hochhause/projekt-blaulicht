[project]
name = "projekt-blaulicht"
version = "0.1.0"
description = "Private, multi-account auto-dispatcher for Leitstellenspiel.de (DE)."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
# The web panel + orchestrator (Phase 5-7). Not needed for the domain layer
# or the Phase 1 smoke test.
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "argon2-cffi>=23.1",     # admin password hashing
    "cryptography>=42.0",    # AES-GCM credential sealing
]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The domain tests are pure-stdlib; this keeps `pytest` and `python -m
# unittest` equivalent.
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"
