[project]
name = "projekt-blaulicht"
version = "0.1.0"
description = "Private, multi-account auto-dispatcher for Leitstellenspiel.de (DE)."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
# The web panel + orchestrator server. Not needed for the domain layer or the
# Phase 1 smoke test. (Admin passwords use stdlib scrypt — no argon2 dep.)
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",  # form posts
    "cryptography>=42.0",       # Fernet credential sealing at rest
]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The domain tests are pure-stdlib; this keeps `pytest` and `python -m
# unittest` equivalent.
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"
